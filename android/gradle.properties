org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# AGP 9 only reads its new declarative DSL by default, which the Flutter
# Gradle plugin doesn't support yet (flutter/flutter#180137) and throws an
# NPE against (flutter/flutter#191703). Stay on the legacy DSL and the
# kotlin-android plugin, as Flutter's own migrator tool does, until the
# Flutter Gradle plugin's own migration lands.
android.newDsl=false
android.builtInKotlin=false
