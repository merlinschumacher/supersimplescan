name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: latest

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze project source
        run: dart analyze

      # - name: Run tests
      #   run: flutter test

      # On a tag push (v1.2.3), the tag is the source of truth for the
      # app's version - not pubspec.yaml, which nothing here bumps
      # automatically. versionCode is derived the same way so it stays
      # strictly increasing across releases, which Google Play requires.
      # workflow_dispatch (used to republish an existing build to a
      # different track) has no tag, so it falls back to pubspec.yaml.
      - name: Determine app version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f2 | cut -d '+' -f1 | tr -d '\r')
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VERSION"
          BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Version name: $RAW_VERSION, version code: $BUILD_NUMBER"
          echo "name=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      #5 Setup Keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      # Must go through `env:` rather than being interpolated straight
      # into the script: the JSON contains a multi-line private key
      # with embedded quotes, and inlining it via ${{ }} splices raw
      # text into the script before bash ever parses it, breaking out
      # of the echo string and corrupting the JSON.
      - name: Decode Play service account credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is empty"
            exit 1
          fi
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > android/app/play-service-account.json
          if ! python3 -m json.tool android/app/play-service-account.json > /dev/null; then
            echo "::error::Decoded credential file is not valid JSON"
            exit 1
          fi

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Build App Bundle
        run: >
          flutter build appbundle
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Publish to Google Play
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew publishReleaseBundle -Pplay.track=${{ inputs.track || 'internal' }} --no-daemon

        #9 Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Releases
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip
            LICENSE

      - name: Clean up signing secrets
        if: always()
        run: rm -f android/app/keystore.jks android/key.properties android/app/play-service-account.json
