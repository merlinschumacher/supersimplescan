plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.github.triplet.play"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "de.merlinschumacher.supersimplescan"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "de.merlinschumacher.supersimplescan"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode.toInteger()
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }
}

play {
    // Only wired up when the credentials are actually present (CI decodes
    // them into this file before a publish); leaving it unset otherwise
    // means ordinary builds never need Play Console access.
    def credentialsFile = file("play-service-account.json")
    if (credentialsFile.exists()) {
        serviceAccountCredentials.set(credentialsFile)
    }
    // Overridden per-run with -Pplay.track=<track>; defaults to the
    // safest track when invoked without one.
    track.set(project.findProperty("play.track")?.toString() ?: "internal")
    defaultToAppBundles.set(true)
}

flutter {
    source = "../.."
}
